name: Deploy LegacyMart Professional Fallback

on:
  push:
    branches: [main]
    paths:
      - 'public-site/**'
      - '.github/workflows/legacymart-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legacymart-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload LegacyMart site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

      - name: Deploy LegacyMart site
        id: deployment
        uses: actions/deploy-pages@v4
